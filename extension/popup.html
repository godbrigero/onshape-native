<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Onshape Native</title>
<link rel="icon" type="image/png" href="icons/icon-32.png">
<style>
body{font:13px system-ui;margin:0;padding:16px;width:270px;background:#fff;color:#182523}.connection{display:flex;align-items:center;gap:10px}#dot{width:7px;height:7px;border-radius:50%;background:#adb5b2}#dot.on{background:#247e61}#status{flex:1}button,select{border:1px solid #d9dedc;background:#fff;border-radius:6px;padding:6px 10px;color:inherit;font:inherit}button{cursor:pointer}label{display:block;margin-top:14px}select{width:100%;margin-top:6px}p{font-size:12px;color:#586761;line-height:1.4;margin-bottom:0}
</style>
<div class="connection"><span id="dot"></span><span id="status" role="status">Disconnected</span><button id="toggle">Connect</button></div>
<label for="editor-mode">Open editors in</label>
<select id="editor-mode"><option value="shadow">Shadow · minimized window</option><option value="minimal">Minimal · compact window</option><option value="background">Background tab</option></select>
<label><input type="checkbox" id="close-after-work"> Close managed editors after work</label>
<p>The agent finishes cleanup after verifying saved work. Your existing tabs stay open. Shadow mode needs this browser running and signed in.</p>
<script type="module" src="popup.js"></script></html>
